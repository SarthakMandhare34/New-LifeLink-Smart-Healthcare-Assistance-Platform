# ============================================================================
# LifeLink Healthcare Platform — Render Blueprint Specification
# ============================================================================
# Official Render deployment blueprint configuration.
# Documentation: https://render.com/docs/blueprint-spec
# ============================================================================

services:
  - type: web
    name: lifelink-healthcare
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: LIFELINK_DEMO_DOCTOR_ACCESS_CODE
        value: lifelink-controlled-clinician-secret-key-2026
      - key: AUTH_PUBLIC_BASE_URL
        value: "https://lifelink-healthcare.onrender.com"
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
